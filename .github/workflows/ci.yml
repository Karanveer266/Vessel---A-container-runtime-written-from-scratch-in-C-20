# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Runtime + daemon. GitHub's ubuntu runners are full VMs with cgroup v2,
  # unprivileged user namespaces (via sudo), BTF and eBPF — so the integration
  # suite runs for real here, including OOM and pids enforcement.
  # ---------------------------------------------------------------------------
  linux:
    name: linux / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc,   cc: gcc-14,   cxx: g++-14,     build_type: RelWithDebInfo, sanitize: OFF }
          - { compiler: clang, cc: clang-18, cxx: clang++-18, build_type: Debug,          sanitize: ON  }
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake pkg-config g++-14 clang-18 \
            libgrpc++-dev protobuf-compiler-grpc libprotobuf-dev protobuf-compiler \
            libssl-dev libgtest-dev libbpf-dev linux-tools-common linux-tools-$(uname -r) \
            busybox-static
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DVESSEL_SANITIZE=${{ matrix.sanitize }} -DVESSEL_WERROR=ON -DVESSEL_EBPF=AUTO
      - name: Build
        run: cmake --build build --parallel
      - name: Unit tests (unprivileged)
        run: ctest --test-dir build --output-on-failure -R 'Strings|Result|Ids|BoundedQueue|Fs|CgroupParse|Seccomp|Syscalls|Aggregator|EventBus|LogBuffer|Gpu|Ring|Gemm|Flash|Worker'
      - name: Integration tests (root: cgroups, namespaces, eBPF)
        # Ubuntu 24.04 restricts unprivileged userns via AppArmor; run as root.
        run: sudo -E ctest --test-dir build --output-on-failure -j1
      - name: Smoke test daemon + CLI
        run: |
          sudo mkdir -p /tmp/rootfs/bin && sudo cp /bin/busybox /tmp/rootfs/bin/
          for l in sh echo cat; do sudo ln -sf busybox /tmp/rootfs/bin/$l; done
          sudo ./build/vesseld --listen unix:///tmp/v.sock --rootfs /tmp/rootfs --state-dir /tmp/vstate &
          sleep 1
          sudo ./build/vesselctl --addr unix:///tmp/v.sock info
          out=$(sudo ./build/vesselctl --addr unix:///tmp/v.sock run --memory 32M --pids 16 -- sh -c 'echo ok-from-container')
          test "$out" = "ok-from-container"
          sudo kill %1

  # Builds the CUDA kernels against the real toolkit (no GPU on hosted runners,
  # so the GPU *execution* path is exercised by the simulated backend tests).
  cuda:
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.6.3-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install NCCL + build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build g++ libgtest-dev libnccl2 libnccl-dev
      - name: Build GPU module with CUDA + NCCL
        run: |
          cmake -S gpu -B build-gpu -G Ninja -DVESSEL_GPU_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES="80;90"
          cmake --build build-gpu --parallel
      - name: Simulated backend tests
        run: ctest --test-dir build-gpu --output-on-failure

  # Cross-compiles vesseld for arm64 Android with the NDK (no gRPC: runtime libs
  # + tests only), proving the runtime layer builds against bionic.
  android-ndk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: ndk
        with: { ndk-version: r27c }
      - name: Cross-compile runtime for arm64-v8a
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DVESSEL_BUILD_DAEMON=OFF -DVESSEL_BUILD_TESTS=OFF -DVESSEL_BUILD_GPU=OFF -DVESSEL_EBPF=OFF
          cmake --build build-android --parallel

  android-app:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build + unit tests
        run: ./gradlew :app:assembleDebug testDebugUnitTest :core:model:test :core:api:test
      - uses: actions/upload-artifact@v4
        with:
          name: vessel-console-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: clang-format check
        run: |
          sudo apt-get install -y clang-format-18
          git ls-files '*.cpp' '*.h' '*.hpp' '*.cu' '*.cuh' | grep -v '^android/' \
            | xargs clang-format-18 --dry-run --Werror
